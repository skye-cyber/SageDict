[package]
name = "sagedict"
version = "0.1.0"
description = "A modern, lightweight cross-platform dictionary application."
authors = ["Wambua Mwikya aka Skye <swskye17@gmail.com>"]
license = "GNU"
repository = "https://github.com/skye-cyber/SageDict"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sagedict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
once_cell = "1"
sevenz-rust = "0.5" # sevenz-rust Dependency 7z

# Global shortcut is desktop-only — this prevents Android/iOS build failures
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]


[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
debug = false
